name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test
        run: npm test
      - name: Test archive mapping
        run: python3 -m unittest discover -s test -p 'test_*.py'
      - name: Build portable Worker
        run: npm run build
